name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Add GOOGLE_SERVICES_JSON_BASE64 in GitHub Actions secrets. It must be the Base64-encoded google-services.json for package com.shivubanna7773.keystonevault."
            exit 1
          fi
          mkdir -p android-config
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android-config/google-services.json
          node -e "const f=require('./android-config/google-services.json'); const app=f.client?.find(x=>x.client_info?.android_client_info?.package_name==='com.shivubanna7773.keystonevault'); if(!app) { console.error('Wrong Android package in google-services.json'); process.exit(1); }"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore stable Android debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Configure Firebase Android app and Google Sign-In
        run: |
          cp android-config/google-services.json android/app/google-services.json
          node <<'NODE'
          const fs = require('fs');
          const rootFile = 'android/build.gradle';
          let root = fs.readFileSync(rootFile, 'utf8');
          if (!root.includes('com.google.gms:google-services')) {
            if (!/dependencies\s*\{/.test(root)) throw new Error('Could not find root Gradle dependencies block');
            root = root.replace(/dependencies\s*\{/, match => match + "\n        classpath 'com.google.gms:google-services:4.4.2'");
            fs.writeFileSync(rootFile, root);
          }
          const appFile = 'android/app/build.gradle';
          let app = fs.readFileSync(appFile, 'utf8');
          if (!app.includes("com.google.gms.google-services")) {
            app += "\n\napply plugin: 'com.google.gms.google-services'\n";
            fs.writeFileSync(appFile, app);
          }
          const varsFile = 'android/variables.gradle';
          let vars = fs.readFileSync(varsFile, 'utf8');
          if (!vars.includes('rgcfaIncludeGoogle')) {
            if (!/ext\s*\{/.test(vars)) throw new Error('Could not find variables.gradle ext block');
            vars = vars.replace(/ext\s*\{/, "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'");
            fs.writeFileSync(varsFile, vars);
          }
          NODE

      - name: Sync native plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Print signing certificate SHA-1
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA-1:'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: keystone-vault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload stable debug signing key
        uses: actions/upload-artifact@v4
        with:
          name: keystone-vault-debug-signing-key
          path: ~/.android/debug.keystore
          if-no-files-found: error
          retention-days: 14
